services:
  frontend-dev:
    profiles: ['dev']
    image: flight-management-system:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: development
    ports:
      - '4200:80'

  frontend-prod:
    profiles: ['prod']
    image: flight-management-system:prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: production
    ports:
      - '4200:80'
