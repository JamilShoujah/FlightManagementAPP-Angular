<div *ngIf="orders.length > 0" class="history-table-wrapper">
  <table class="modern-table previous-orders-table">
    <thead>
      <tr>
        <th>Flight</th>
        <th>Status</th>
        <th>Items</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let flight of orders; trackBy: trackByFlightId">
        <td>
          <div class="flight-info">
            <strong>{{ flight.brand }}</strong>
            <div class="plane-type">{{ flight.planeType }}</div>
          </div>
        </td>
        <ng-container *ngIf="flight.orderInfo as order; else noOrderCells">
          <td>
            <span class="status-pill" [ngClass]="order.status.toLowerCase()">
              {{ order.status }}
            </span>
          </td>
          <td>
            <div class="items-list">
              <div
                class="history-item"
                *ngFor="let item of order.itemsRequested; trackBy: trackByItemId"
              >
                {{ getFoodName(getItemFoodId(item)) }} × {{ item.quantity }}
              </div>
            </div>
          </td>
        </ng-container>
        <ng-template #noOrderCells>
          <td>
            <span class="status-pill none">No Order</span>
          </td>
          <td>
            <div class="items-list">—</div>
          </td>
        </ng-template>
      </tr>
    </tbody>
  </table>
</div>
